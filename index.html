<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplikasi Keuangan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#6366f1;--p2:#8b5cf6;--bg:#f4f6ff;--card:#fff;--tx:#1e293b;--mut:#64748b;--bd:#e6eaf7}
[data-bs-theme=dark]{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--bd:#334155}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:.93rem}
body.auth{background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);min-height:100vh}
.card{background:var(--card);border:1px solid var(--bd);box-shadow:0 4px 18px rgba(99,102,241,.07);border-radius:18px;color:var(--tx)}
.topbar{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:.7rem 0;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(99,102,241,.3)}
.topbar .brand{font-weight:700;font-size:1.1rem}
.stat{font-size:1.2rem;font-weight:700;line-height:1.2}
.stat-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
.ic-success{background:rgba(16,185,129,.15);color:#10b981}.ic-danger{background:rgba(244,63,94,.15);color:#f43f5e}
.ic-primary{background:rgba(99,102,241,.15);color:#6366f1}.ic-dark{background:rgba(100,116,139,.18);color:var(--mut)}
.nav-pills .nav-link{border-radius:12px;color:var(--mut);font-weight:600;white-space:nowrap}
.nav-pills .nav-link.active{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--p2));border:0;border-radius:10px}
.btn-primary:hover{opacity:.9;background:linear-gradient(135deg,var(--p),var(--p2))}
.form-control,.form-select{border-radius:10px;background-color:var(--card);border-color:var(--bd)}
.form-control:focus,.form-select:focus{border-color:var(--p);box-shadow:0 0 0 .2rem rgba(99,102,241,.18)}
.table{--bs-table-bg:transparent}
.table-light{--bs-table-bg:var(--bg);--bs-table-color:var(--mut)}
.badge{border-radius:8px;font-weight:600}
.modal-content{border-radius:18px;background:var(--card)}
.progress{border-radius:10px}
.border{border-color:var(--bd)!important}
.wl{border-radius:14px;background:var(--card)}
#login{max-width:370px;margin:14vh auto;padding:2rem!important;border:0}
#login input{letter-spacing:.5rem}
.table-responsive{max-height:60vh}
@media(max-width:767.98px){
  body{padding-bottom:88px}
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:1030;margin:0!important;padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -6px 20px rgba(0,0,0,.08);overflow:visible!important;justify-content:space-around}
  #tabs .nav-item{flex:1}
  #tabs .nav-link{display:flex;flex-direction:column;align-items:center;gap:1px;padding:.35rem 0;font-size:.62rem;border-radius:12px}
  #tabs .nav-link i{font-size:1.2rem}
  .stat{font-size:1.05rem}
}
@media(min-width:768px){#tabs .nav-link i{margin-right:.4rem}}
@media(max-width:575.98px){
  .table-stack thead{display:none}
  .table-stack tr{display:block;border:1px solid var(--bd);border-radius:12px;margin-bottom:.6rem;padding:.35rem .8rem;background:var(--card)}
  .table-stack td{display:flex;justify-content:space-between;gap:1rem;border:0!important;padding:.25rem 0!important;text-align:right;background:transparent!important}
  .table-stack td::before{content:attr(data-label);color:var(--mut);font-weight:500;text-align:left}
  .table-stack td:last-child{justify-content:flex-end}
  .table-responsive{max-height:none}
  .card{border-radius:16px}
}
#fab{position:fixed;right:18px;bottom:92px;z-index:1029;width:56px;height:56px;border-radius:50%;font-size:1.6rem;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 8px 20px rgba(99,102,241,.45)}
@media(min-width:768px){#fab{bottom:28px;right:28px}}
.chips{margin-top:.5rem;font-size:.75rem}
.chip-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:4px}
.chip-row span{width:84px;color:var(--mut);font-weight:600}
.chip-row .btn{padding:.1rem .45rem;font-size:.75rem;border-radius:8px}
.toast-lite{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#10b981;color:#fff;padding:.5rem 1.1rem;border-radius:12px;z-index:2000;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.chart-box{position:relative;height:260px}
@media(max-width:575.98px){.chart-box{height:230px}}
</style>
</head>
<body class="auth">

<!-- LOGIN -->
<div id="login" class="card p-4 text-center">
  <h4 class="mb-1">💰 Aplikasi Keuangan</h4>
  <p class="text-muted small">Masukkan PIN</p>
  <div class="input-group input-group-lg mb-2"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" class="form-control text-center" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn btn-outline-secondary" type="button" onclick="togglePin('pin',this)" title="Tampilkan PIN"><i class="bi bi-eye"></i></button></div>
  <button class="btn btn-primary w-100" onclick="doLogin()">Masuk</button>
  <div id="lerr" class="text-danger small mt-2"></div>
</div>

<!-- APP -->
<div id="app" class="d-none">
  <button id="fab" class="btn btn-primary" onclick="quickAdd()" title="Tambah cepat"><i class="bi bi-plus-lg"></i></button>
  <nav class="topbar mb-3">
    <div class="container-xl d-flex justify-content-between align-items-center">
      <span class="brand">💰 Aplikasi Keuangan</span>
      <div>
        <button class="btn btn-sm btn-light" onclick="chgPin()"><i class="bi bi-key"></i></button>
        <button class="btn btn-sm btn-light text-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </nav>
  <div class="container-xl pb-4">
    <ul class="nav nav-pills mb-3 flex-nowrap" id="tabs"></ul>
    <div id="view"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h6 class="modal-title" id="mtitle"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="mbody"></div>
  <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary" id="msave">Simpan</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
/* === ISI DENGAN URL WEB APP APPS SCRIPT ANDA (berakhiran /exec) === */
const API_URL = 'PASTE_URL_EXEC_DI_SINI';
async function rpc(fn,args){
  const res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'});
  const j = await res.json();
  if(j.error) throw new Error(j.error);
  return j.data;
}
document.documentElement.setAttribute('data-bs-theme', matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const PAL=['#6366f1','#ec4899','#f59e0b','#10b981','#06b6d4','#8b5cf6','#f43f5e','#84cc16','#0ea5e9','#f97316','#64748b'];
const TI={Dashboard:'bi-grid-1x2-fill',Suami:'bi-person-fill',Istri:'bi-person-heart',Tabungan:'bi-piggy-bank-fill',Wishlist:'bi-gift-fill',Kategori:'bi-tags-fill',Anggaran:'bi-speedometer2'};
let TOKEN = '', D = {Transaksi:[],Kategori:[],Tabungan:[],Wishlist:[],Anggaran:[],Target:[]}, tab = 'Dashboard', charts = [];
const TABS = ['Dashboard','Suami','Istri','Anggaran','Tabungan','Wishlist','Kategori'];
const FS = {};  // filter state per tab
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const ym = d => String(d||'').slice(0,7);
const sum = a => a.reduce((s,x)=>s+Number(x.Jumlah||0),0);

/* ---------- server ---------- */
function call(action, name, data){
  return rpc('api',[TOKEN,action,name,data]).catch(e=>{
    if(/AUTH/.test(e.message)){ alert('Sesi habis, login ulang'); logout(); } else alert(e.message);
    throw e;
  });
}
function doLogin(){
  $('lerr').textContent='';
  rpc('login',[$('pin').value]).then(r=>{
    if(!r.ok){ $('lerr').textContent = r.locked ? 'Terlalu banyak percobaan salah. Coba lagi 5 menit lagi.' : 'PIN salah'+(r.left!==undefined?' (sisa '+r.left+' percobaan)':''); $('pin').value=''; return; }
    TOKEN=r.token; try{sessionStorage.setItem('tk',TOKEN);}catch(e){} bump(); document.body.classList.remove('auth'); $('login').classList.add('d-none'); $('app').classList.remove('d-none'); load();
  }).catch(e=>{ $('lerr').textContent='Gagal terhubung: '+e.message; });
}
function logout(){ try{sessionStorage.removeItem('tk');}catch(e){} clearTimeout(idleT); document.body.classList.add('auth'); TOKEN=''; $('pin').value=''; $('app').classList.add('d-none'); $('login').classList.remove('d-none'); }
async function load(){ D = await call('all'); render(); }
function togglePin(id,btn){
  const i=$(id), show=i.type==='password'; i.type=show?'text':'password';
  btn.innerHTML=`<i class="bi bi-eye${show?'-slash':''}"></i>`;
}
function chgPin(){
  $('mtitle').textContent='Ganti PIN';
  $('mbody').innerHTML=`<div class="mb-2"><label class="form-label small mb-1">PIN lama</label><input id="op" type="password" inputmode="numeric" maxlength="8" autocomplete="off" class="form-control"></div>
  <div class="mb-2"><label class="form-label small mb-1">PIN baru (4-8 angka)</label><input id="np" type="password" inputmode="numeric" maxlength="8" autocomplete="off" class="form-control"></div>
  <div class="form-check"><input class="form-check-input" type="checkbox" id="sp" onchange="['op','np'].forEach(i=>$(i).type=this.checked?'text':'password')"><label class="form-check-label small" for="sp">Tampilkan PIN</label></div>`;
  $('msave').onclick=savePin;
  modal = modal || new bootstrap.Modal($('modal')); modal.show();
}
async function savePin(){
  const o=$('op').value, n=$('np').value;
  if(!/^\d{4,8}$/.test(n)) return alert('PIN baru harus 4-8 angka');
  $('msave').disabled=true;
  try{ await call('pin','',{old:o,new:n}); modal.hide(); alert('PIN berhasil diganti'); }catch(e){} finally{ $('msave').disabled=false; }
}

/* ---------- hitung ---------- */
const trx = o => D.Transaksi.filter(t=>t.Pemilik===o);
function saldo(o){ // o: 'Suami' | 'Istri' | 'Semua'
  const owners = o==='Semua' ? ['Suami','Istri'] : [o];
  let m=0,k=0,s=0;
  owners.forEach(p=>{
    m+=sum(trx(p).filter(t=>t.Tipe==='Pemasukan'));
    k+=sum(trx(p).filter(t=>t.Tipe==='Pengeluaran'));
    s+=sum(D.Tabungan.filter(t=>t.Pemilik===p));
  });
  return {masuk:m,keluar:k,tabung:s,saldo:m-k-s};
}

/* ---------- render ---------- */
function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  $('tabs').innerHTML = TABS.map(t=>`<li class="nav-item"><a href="#" class="nav-link ${t===tab?'active':''}" onclick="go('${t}');return false"><i class="bi ${TI[t]}"></i><span>${t}</span></a></li>`).join('');
  const v = $('view');
  if(tab==='Dashboard') v.innerHTML = dash();
  else if(tab==='Suami'||tab==='Istri') v.innerHTML = trxView(tab);
  else if(tab==='Anggaran') v.innerHTML = angView();
  else if(tab==='Tabungan') v.innerHTML = savView();
  else if(tab==='Wishlist') v.innerHTML = wlView();
  else v.innerHTML = katView();
  if(tab==='Dashboard') drawCharts();
}
function go(t){ tab=t; render(); }
function setF(k,val){ (FS[tab]=FS[tab]||{})[k]=val; render(); }
const F = k => (FS[tab]||{})[k]||'';
const nm=x=>String(x||'').trim().toLowerCase();
function katOpts(tipe){
  const l=D.Kategori.filter(k=>!tipe||!k.Tipe||nm(k.Tipe)===nm(tipe));
  return (l.length||!tipe)?l:D.Kategori;   // jika kosong, tampilkan semua kategori
}

/* Dashboard */
function dash(){
  const bulan = F('bulan') || today().slice(0,7);
  const all = D.Transaksi.filter(t=>ym(t.Tanggal)===bulan);
  const m = sum(all.filter(t=>t.Tipe==='Pemasukan')), k = sum(all.filter(t=>t.Tipe==='Pengeluaran'));
  const tb = sum(D.Tabungan.filter(t=>ym(t.Tanggal)===bulan));
  const S = saldo('Semua');
  const card=(l,v,c,i,sub)=>`<div class="col-6 col-lg-3"><div class="card p-3 h-100"><div class="d-flex align-items-center gap-2"><div class="stat-ic ic-${c}"><i class="bi ${i}"></i></div><div class="text-muted small lh-sm">${l}</div></div><div class="stat mt-2 text-${c==='dark'?(S.saldo<0?'danger':'body'):c}">${rp(v)}</div>${sub?`<div class="small text-muted mt-1">${sub}</div>`:''}</div></div>`;
  const row=o=>{const s=saldo(o);return `<tr><td>${o}</td><td class="text-end">${rp(s.masuk)}</td><td class="text-end">${rp(s.keluar)}</td><td class="text-end">${rp(s.tabung)}</td><td class="text-end fw-bold">${rp(s.saldo)}</td></tr>`};
  const rasio = m? Math.round(k/m*100):0;
  const recent = [...D.Transaksi].sort((a,b)=>b.Tanggal.localeCompare(a.Tanggal)).slice(0,5)
    .map(t=>`<li class="list-group-item d-flex justify-content-between"><span>${esc(t.Tanggal)} · <b>${esc(t.Pemilik)}</b> · ${esc(t.Kategori)}</span><span class="text-${t.Tipe==='Pemasukan'?'success':'danger'}">${rp(t.Jumlah)}</span></li>`).join('');
  return `
  <div class="d-flex align-items-center gap-2 mb-3"><label class="small text-muted">Bulan</label><input type="month" class="form-control form-control-sm w-auto" value="${bulan}" onchange="setF('bulan',this.value)"></div>
  <div class="row g-3 mb-3">${card('Pemasukan',m,'success','bi-arrow-down-left')}${card('Pengeluaran',k,'danger','bi-arrow-up-right')}${card('Ditabung bulan ini',tb,'primary','bi-piggy-bank','Total semua bulan: '+rp(S.tabung))}${card('Saldo Tersedia',S.saldo,'dark','bi-wallet2','Akumulasi semua bulan (sudah dikurangi tabungan)')}</div>
  <div class="alert ${rasio>90?'alert-danger':rasio>70?'alert-warning':'alert-success'} py-2">Pengeluaran bulan ini <b>${rasio}%</b> dari pemasukan.${rasio>90?' Hati-hati, hampir habis!':''}</div>
  ${budgetBox(bulan)}
  <div class="row g-3 mb-3">
    <div class="col-lg-6"><div class="card p-3 h-100"><h6>Pengeluaran per Kategori</h6><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
    <div class="col-lg-6"><div class="card p-3 h-100"><h6>Tren 6 Bulan</h6><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-7"><div class="card p-3"><h6>Saldo Keseluruhan</h6><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th></th><th class="text-end">Masuk</th><th class="text-end">Keluar</th><th class="text-end">Tabungan</th><th class="text-end">Saldo</th></tr></thead><tbody>${row('Suami')}${row('Istri')}${row('Semua')}</tbody></table></div></div></div>
    <div class="col-lg-5"><div class="card p-3"><h6>5 Transaksi Terakhir</h6><ul class="list-group list-group-flush small">${recent||'<li class="list-group-item text-muted">Belum ada data</li>'}</ul></div></div>
  </div>`;
}
function drawCharts(){
  Chart.defaults.color=getComputedStyle(document.body).color; Chart.defaults.font.family='Inter,system-ui';
  const bulan = F('bulan') || today().slice(0,7);
  const by={}; D.Transaksi.filter(t=>ym(t.Tanggal)===bulan&&t.Tipe==='Pengeluaran').forEach(t=>by[t.Kategori]=(by[t.Kategori]||0)+Number(t.Jumlah));
  charts.push(new Chart($('c1'),{type:'doughnut',data:{labels:Object.keys(by),datasets:[{data:Object.values(by),backgroundColor:PAL,borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12}}}}}));
  const ms=[],d=new Date(bulan+'-01'); for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));}
  const q=tp=>ms.map(b=>sum(D.Transaksi.filter(t=>ym(t.Tanggal)===b&&t.Tipe===tp)));
  charts.push(new Chart($('c2'),{type:'bar',data:{labels:ms,datasets:[{label:'Pemasukan',data:q('Pemasukan'),backgroundColor:'#10b981',borderRadius:6},{label:'Pengeluaran',data:q('Pengeluaran'),backgroundColor:'#f43f5e',borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12}}}}}));
}

/* Transaksi Suami / Istri */
function trxView(o){
  const bulan=F('bulan'), kat=F('kat'), tipe=F('tipe'), q=F('q').toLowerCase();
  const rows = trx(o).filter(t=>(!bulan||ym(t.Tanggal)===bulan)&&(!kat||t.Kategori===kat)&&(!tipe||t.Tipe===tipe)&&(!q||(t.Keterangan+t.Kategori).toLowerCase().includes(q)))
    .sort((a,b)=>b.Tanggal.localeCompare(a.Tanggal));
  const m=sum(rows.filter(t=>t.Tipe==='Pemasukan')), k=sum(rows.filter(t=>t.Tipe==='Pengeluaran')), s=saldo(o);
  return `<div class="card p-3">
    <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
      <h6 class="mb-0 me-auto">${o} <span class="badge text-bg-light">Saldo ${rp(s.saldo)}</span></h6>
      <button class="btn btn-sm btn-primary" onclick="openForm('Transaksi',null,'${o}')"><i class="bi bi-plus-lg"></i> Tambah</button>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6 col-md-3"><input type="month" class="form-control form-control-sm" value="${bulan}" onchange="setF('bulan',this.value)"></div>
      <div class="col-6 col-md-3"><select class="form-select form-select-sm" onchange="setF('tipe',this.value)"><option value="">Semua tipe</option>${['Pemasukan','Pengeluaran'].map(x=>`<option ${x===tipe?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="col-6 col-md-3"><select class="form-select form-select-sm" onchange="setF('kat',this.value)"><option value="">Semua kategori</option>${katOpts().map(x=>x.Nama).filter((v,i,a)=>a.indexOf(v)===i).map(x=>`<option ${x===kat?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="col-6 col-md-3"><input class="form-control form-control-sm" placeholder="Cari..." value="${esc(F('q'))}" onchange="setF('q',this.value)"></div>
    </div>
    <div class="table-responsive"><table class="table table-sm table-hover align-middle table-stack">
      <thead class="table-light"><tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Keterangan</th><th class="text-end">Jumlah</th><th></th></tr></thead>
      <tbody>${rows.map(t=>`<tr><td data-label="Tanggal">${esc(t.Tanggal)}</td><td data-label="Tipe"><span class="badge text-bg-${t.Tipe==='Pemasukan'?'success':'danger'}">${t.Tipe}</span></td><td data-label="Kategori">${esc(t.Kategori)}</td><td data-label="Keterangan">${esc(t.Keterangan)}</td><td class="text-end" data-label="Jumlah"><b>${rp(t.Jumlah)}</b></td><td class="text-nowrap">${acts('Transaksi',t.ID)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center text-muted">Tidak ada data</td></tr>'}</tbody>
    </table></div>
    <div class="small text-end">Masuk: <b class="text-success">${rp(m)}</b> · Keluar: <b class="text-danger">${rp(k)}</b> · Selisih: <b>${rp(m-k)}</b></div>
  </div>`;
}
const acts=(n,id)=>`<button class="btn btn-sm btn-link p-0 me-2" onclick="openForm('${n}','${id}')"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-link text-danger p-0" onclick="del('${n}','${id}')"><i class="bi bi-trash"></i></button>`;

/* Anggaran */
const spent=(kat,b)=>sum(D.Transaksi.filter(t=>t.Tipe==='Pengeluaran'&&t.Kategori===kat&&ym(t.Tanggal)===b));
const pct=(s,b)=>b?Math.round(s/b*100):0;
const bar=(s,b)=>{const p=pct(s,b),c=p>=100?'danger':p>=80?'warning':'success';return `<div class="progress" style="height:8px"><div class="progress-bar bg-${c}" style="width:${Math.min(p,100)}%"></div></div>`;};
function budgetBox(b){
  if(!D.Anggaran.length) return '';
  const it=D.Anggaran.map(a=>({a,s:spent(a.Kategori,b)})).sort((x,y)=>pct(y.s,y.a.Batas)-pct(x.s,x.a.Batas)).slice(0,6);
  const over=it.filter(x=>x.s>x.a.Batas).length;
  return `<div class="card p-3 mb-3"><div class="d-flex justify-content-between"><h6>Anggaran Bulan Ini ${over?`<span class="badge text-bg-danger">${over} melebihi batas</span>`:''}</h6><a href="#" class="small" onclick="go('Anggaran');return false">Kelola</a></div>`+
    it.map(({a,s})=>`<div class="mb-2"><div class="d-flex justify-content-between small"><span>${esc(a.Kategori)}</span><span class="${s>a.Batas?'text-danger fw-bold':''}">${rp(s)} / ${rp(a.Batas)}</span></div>${bar(s,a.Batas)}</div>`).join('')+`</div>`;
}
function angView(){
  const b=F('bulan')||today().slice(0,7);
  const tot=sum(D.Anggaran.map(a=>({Jumlah:a.Batas}))), sp=D.Anggaran.reduce((x,a)=>x+spent(a.Kategori,b),0);
  return `<div class="card p-3"><div class="d-flex flex-wrap gap-2 mb-2 align-items-center"><h6 class="mb-0 me-auto">Anggaran Bulanan</h6>
    <input type="month" class="form-control form-control-sm w-auto" value="${b}" onchange="setF('bulan',this.value)">
    <button class="btn btn-sm btn-primary" onclick="openForm('Anggaran')"><i class="bi bi-plus-lg"></i> Tambah</button></div>
    <div class="small text-muted mb-3">Total anggaran ${rp(tot)} · terpakai ${rp(sp)} · sisa <b>${rp(tot-sp)}</b></div>
    <div class="row g-3">`+(D.Anggaran.map(a=>{const s=spent(a.Kategori,b);return `<div class="col-md-6"><div class="border wl p-3"><div class="d-flex justify-content-between"><b>${esc(a.Kategori)}</b><span>${acts('Anggaran',a.ID)}</span></div><div class="small text-muted">${rp(s)} dari ${rp(a.Batas)} (${pct(s,a.Batas)}%)</div><div class="my-1">${bar(s,a.Batas)}</div><div class="small ${s>a.Batas?'text-danger':'text-success'}">${s>a.Batas?'Melebihi '+rp(s-a.Batas):'Sisa '+rp(a.Batas-s)}</div></div></div>`;}).join('')||'<div class="text-muted text-center">Belum ada anggaran. Klik Tambah untuk menetapkan batas per kategori.</div>')+`</div></div>`;
}

/* Tabungan + Target */
function tgtCard(g){
  const sv=D.Tabungan.filter(t=>t.Tujuan===g.Nama&&(g.Pemilik==='Bersama'||t.Pemilik===g.Pemilik));
  const got=sum(sv), p=Math.max(0,Math.min(100,pct(got,g.Target)));
  const st=sv.filter(t=>t.Jumlah>0), mo=new Set(st.map(t=>ym(t.Tanggal))).size, avg=mo?sum(st)/mo:0, sisa=g.Target-got;
  const est=sisa<=0?'🎉 Target tercapai':avg>0?`Estimasi ±${Math.ceil(sisa/avg)} bulan lagi (rata-rata ${rp(avg)}/bln)`:'Belum ada setoran';
  return `<div class="col-md-6 col-lg-4"><div class="border wl p-3 h-100"><div class="d-flex justify-content-between"><b>${esc(g.Nama)}</b><span class="badge text-bg-light">${g.Pemilik}</span></div><div class="small text-muted">${rp(got)} / ${rp(g.Target)} (${p}%)</div><div class="progress my-2" style="height:8px"><div class="progress-bar ${p>=100?'bg-success':''}" style="width:${p}%"></div></div><div class="small">${est}</div><div class="mt-2">${acts('Target',g.ID)}</div></div></div>`;
}
function savView(){
  const bulan=F('bulan'), p=F('pemilik');
  const rows=D.Tabungan.filter(t=>(!bulan||ym(t.Tanggal)===bulan)&&(!p||t.Pemilik===p)).sort((a,b)=>b.Tanggal.localeCompare(a.Tanggal));
  const tot=o=>sum(D.Tabungan.filter(t=>t.Pemilik===o));
  return `<div class="card p-3 mb-3">
    <div class="d-flex gap-2 mb-3 align-items-center"><h6 class="mb-0 me-auto">Target Tabungan</h6><button class="btn btn-sm btn-primary" onclick="openForm('Target')"><i class="bi bi-plus-lg"></i> Target</button></div>
    <div class="row g-3">${D.Target.map(tgtCard).join('')||'<div class="text-muted text-center small">Belum ada target (mis. Dana Darurat, Liburan). Setoran dengan nama tujuan yang sama otomatis masuk ke target.</div>'}</div></div>
  <div class="card p-3">
    <div class="d-flex flex-wrap gap-2 mb-3 align-items-center"><h6 class="mb-0 me-auto">Riwayat Tabungan</h6>
      <button class="btn btn-sm btn-primary" onclick="openForm('Tabungan')"><i class="bi bi-plus-lg"></i> Setor</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="openForm('Tabungan',null,null,'Tarik')"><i class="bi bi-dash-lg"></i> Tarik</button></div>
    <div class="row g-2 mb-3 text-center">
      <div class="col-4"><div class="border rounded p-2"><div class="small text-muted">Suami</div><b>${rp(tot('Suami'))}</b></div></div>
      <div class="col-4"><div class="border rounded p-2"><div class="small text-muted">Istri</div><b>${rp(tot('Istri'))}</b></div></div>
      <div class="col-4"><div class="border rounded p-2"><div class="small text-muted">Total</div><b>${rp(tot('Suami')+tot('Istri'))}</b></div></div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6"><input type="month" class="form-control form-control-sm" value="${bulan}" onchange="setF('bulan',this.value)"></div>
      <div class="col-6"><select class="form-select form-select-sm" onchange="setF('pemilik',this.value)"><option value="">Semua</option>${['Suami','Istri'].map(x=>`<option ${x===p?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="table-responsive"><table class="table table-sm table-hover table-stack"><thead class="table-light"><tr><th>Tanggal</th><th>Jenis</th><th>Pemilik</th><th>Tujuan</th><th class="text-end">Jumlah</th><th></th></tr></thead>
    <tbody>${rows.map(t=>`<tr><td data-label="Tanggal">${esc(t.Tanggal)}</td><td data-label="Jenis"><span class="badge text-bg-${t.Jumlah<0?'warning':'primary'}">${t.Jumlah<0?'Tarik':'Setor'}</span></td><td data-label="Pemilik">${t.Pemilik}</td><td data-label="Tujuan">${esc(t.Tujuan)}</td><td class="text-end" data-label="Jumlah"><b>${rp(Math.abs(t.Jumlah))}</b></td><td>${acts('Tabungan',t.ID)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center text-muted">Belum ada tabungan</td></tr>'}</tbody></table></div>
    <div class="small text-muted">Setoran mengurangi saldo tersedia; penarikan menambahkannya kembali.</div>
  </div>`;
}

/* Wishlist (berdasarkan saldo) */
function wlView(){
  const st=F('status')||'Aktif', p=F('pemilik');
  const pr={Tinggi:0,Sedang:1,Rendah:2};
  const rows=D.Wishlist.filter(w=>(!st||w.Status===st)&&(!p||w.Pemilik===p)).sort((a,b)=>pr[a.Prioritas]-pr[b.Prioritas]);
  const sal={Suami:saldo('Suami').saldo,Istri:saldo('Istri').saldo,Bersama:saldo('Semua').saldo};
  return `<div class="card p-3">
    <div class="d-flex flex-wrap gap-2 mb-2 align-items-center"><h6 class="mb-0 me-auto">Wishlist</h6><button class="btn btn-sm btn-primary" onclick="openForm('Wishlist')"><i class="bi bi-plus-lg"></i> Tambah</button></div>
    <div class="small text-muted mb-3">Saldo tersedia — Suami: <b>${rp(sal.Suami)}</b> · Istri: <b>${rp(sal.Istri)}</b> · Bersama: <b>${rp(sal.Bersama)}</b></div>
    <div class="row g-2 mb-3">
      <div class="col-6"><select class="form-select form-select-sm" onchange="setF('status',this.value)">${['Aktif','Terbeli'].map(x=>`<option ${x===st?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="col-6"><select class="form-select form-select-sm" onchange="setF('pemilik',this.value)"><option value="">Semua</option>${['Suami','Istri','Bersama'].map(x=>`<option ${x===p?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="row g-3">${rows.map(w=>{
      const s=sal[w.Pemilik]||0, pct=Math.max(0,Math.min(100,Math.round(s/w.Harga*100))), ok=s>=w.Harga;
      return `<div class="col-md-6 col-lg-4"><div class="border wl p-3 h-100">
        <div class="d-flex justify-content-between"><b>${esc(w.Nama)}</b><span class="badge text-bg-${w.Prioritas==='Tinggi'?'danger':w.Prioritas==='Sedang'?'warning':'secondary'}">${w.Prioritas}</span></div>
        <div class="small text-muted">${w.Pemilik} · ${rp(w.Harga)}</div>
        <div class="progress my-2" style="height:8px"><div class="progress-bar ${ok?'bg-success':''}" style="width:${pct}%"></div></div>
        <div class="small ${ok?'text-success':'text-danger'}">${ok?'✅ Saldo cukup, bisa dibeli':'Kurang '+rp(w.Harga-s)} (${pct}%)</div>
        <div class="mt-2">${acts('Wishlist',w.ID)}${w.Status==='Aktif'?`<button class="btn btn-sm btn-outline-success py-0 ms-2" onclick="bought('${w.ID}')">Tandai terbeli</button>`:''}</div>
      </div></div>`;}).join('')||'<div class="text-muted text-center">Belum ada wishlist</div>'}</div>
  </div>`;
}
async function bought(id){
  const w=D.Wishlist.find(x=>x.ID===id); w.Status='Terbeli'; await call('save','Wishlist',w); render();
}

/* Kategori */
function katView(){
  const t=F('tipe');
  const rows=D.Kategori.filter(k=>!t||nm(k.Tipe)===nm(t)).sort((a,b)=>String(a.Tipe).localeCompare(String(b.Tipe))||String(a.Nama).localeCompare(String(b.Nama)));
  return `<div class="card p-3">
    <div class="d-flex gap-2 mb-3 align-items-center"><h6 class="mb-0 me-auto">Kategori Umum</h6>
      <select class="form-select form-select-sm w-auto" onchange="setF('tipe',this.value)"><option value="">Semua</option>${['Pemasukan','Pengeluaran'].map(x=>`<option ${x===t?'selected':''}>${x}</option>`).join('')}</select>
      <button class="btn btn-sm btn-primary" onclick="openForm('Kategori')"><i class="bi bi-plus-lg"></i></button></div>
    <table class="table table-sm"><tbody>${rows.map(k=>`<tr><td>${esc(k.Nama)}</td><td><span class="badge text-bg-${k.Tipe==='Pemasukan'?'success':'danger'}">${k.Tipe}</span></td><td class="text-end">${acts('Kategori',k.ID)}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

/* ---------- Form modal generik ---------- */
const FIELDS = {
  Transaksi:[['Pemilik','select',['Suami','Istri']],['Tanggal','date'],['Tipe','select',['Pemasukan','Pengeluaran']],['Kategori','kategori'],['Keterangan','text'],['Jumlah','number']],
  Tabungan:[['Tanggal','date'],['Jenis','select',['Setor','Tarik']],['Pemilik','select',['Suami','Istri']],['Tujuan','tujuan'],['Jumlah','number']],
  Target:[['Nama','text'],['Pemilik','select',['Suami','Istri','Bersama']],['Target','number']],
  Anggaran:[['Kategori','kategori'],['Batas','number']],
  Wishlist:[['Nama','text'],['Pemilik','select',['Suami','Istri','Bersama']],['Harga','number'],['Prioritas','select',['Tinggi','Sedang','Rendah']],['Status','select',['Aktif','Terbeli']]],
  Kategori:[['Nama','text'],['Tipe','select',['Pemasukan','Pengeluaran']]]
};
/* ---------- Nominal, toast, FAB, idle ---------- */
const CHIPS=[['Ribuan',[[1e3,'1rb'],[2e3,'2rb'],[5e3,'5rb'],[10e3,'10rb'],[20e3,'20rb'],[50e3,'50rb']]],
  ['Ratusan ribu',[[1e5,'100rb'],[2e5,'200rb'],[3e5,'300rb'],[5e5,'500rb'],[75e4,'750rb']]],
  ['Jutaan',[[1e6,'1jt'],[2e6,'2jt'],[5e6,'5jt'],[10e6,'10jt'],[20e6,'20jt']]]];
const chips=id=>`<div class="chips">${CHIPS.map(([l,a])=>`<div class="chip-row"><span>${l}</span>${a.map(([n,t])=>`<button type="button" class="btn btn-outline-primary" onclick="addRp('${id}',${n})">+${t}</button>`).join('')}</div>`).join('')}<button type="button" class="btn btn-link text-danger p-0" onclick="setRp('${id}',0)">Hapus nominal</button></div>`;
const numRp=id=>Number($(id).value.replace(/\D/g,''))||0;
function setRp(id,n){ $(id).value=n?n.toLocaleString('id-ID'):''; }
function addRp(id,n){ setRp(id,numRp(id)+n); }
function fmtRp(el){ const d=el.value.replace(/\D/g,''); el.value=d?Number(d).toLocaleString('id-ID'):''; }
function toast(m){ const d=document.createElement('div'); d.className='toast-lite'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function quickAdd(){
  if(['Tabungan','Wishlist','Anggaran','Kategori'].includes(tab)) return openForm(tab);
  openForm('Transaksi',null,tab==='Istri'?'Istri':'Suami');
}
let idleT;
const bump=()=>{ clearTimeout(idleT); try{ if(TOKEN) sessionStorage.setItem('la',Date.now()); }catch(e){} if(TOKEN) idleT=setTimeout(()=>{ logout(); $('lerr').textContent='Keluar otomatis karena tidak aktif.'; },600000); };
['click','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,bump,{passive:true}));

let modal, cur;
function openForm(name,id,owner,jenis){
  const old = id ? D[name].find(x=>x.ID===id) : null;
  cur = {name, obj: old ? {...old} : {Tanggal:today(), Tipe:'Pengeluaran', Prioritas:'Sedang', Status:'Aktif', Pemilik: owner||(name==='Target'?'Bersama':'Suami'), Jenis: jenis||'Setor'}};
  if(name==='Tabungan'&&old){ cur.obj.Jenis=old.Jumlah<0?'Tarik':'Setor'; cur.obj.Jumlah=Math.abs(old.Jumlah); }
  $('mtitle').textContent = (old?'Edit ':'Tambah ')+name;
  $('mbody').innerHTML = FIELDS[name].map(([k,t,o])=>{
    const v = cur.obj[k]??'';
    let inp;
    if(t==='select') inp=`<select class="form-select" id="f_${k}" ${k==='Tipe'&&name==='Transaksi'?'onchange="refKat()"':''}>${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
    else if(t==='kategori') inp=`<select class="form-select" id="f_${k}"></select>`;
    else if(t==='tujuan') inp=`<input class="form-control" id="f_${k}" list="dl" value="${esc(v)}" placeholder="mis. Dana Darurat"><datalist id="dl">${D.Target.map(g=>`<option value="${esc(g.Nama)}">`).join('')}</datalist>`;
    else if(t==='number') inp=`<input class="form-control form-control-lg" id="f_${k}" inputmode="numeric" autocomplete="off" placeholder="0" value="${v!==''?Number(v).toLocaleString('id-ID'):''}" oninput="fmtRp(this)">${chips('f_'+k)}`;
    else inp=`<input class="form-control" id="f_${k}" type="${t}" value="${esc(v)}" ${t==='number'?'min="0" inputmode="numeric"':''}>`;
    return `<div class="mb-2"><label class="form-label small mb-1">${k}</label>${inp}</div>`;
  }).join('');
  if(name==='Transaksi') refKat(cur.obj.Kategori);
  else if(name==='Anggaran') $('f_Kategori').innerHTML=katOpts('Pengeluaran').map(k=>`<option ${k.Nama===cur.obj.Kategori?'selected':''}>${esc(k.Nama)}</option>`).join('');
  $('msave').onclick = saveForm;
  modal = modal || new bootstrap.Modal($('modal')); modal.show();
}
function refKat(sel){
  const tp=$('f_Tipe').value;
  const l=katOpts(tp);
  $('f_Kategori').innerHTML = l.length ? l.map(k=>`<option ${k.Nama===sel?'selected':''}>${esc(k.Nama)}</option>`).join('') : '<option value="">(Belum ada kategori - tambah di tab Kategori)</option>';
}
async function saveForm(){
  const o = cur.obj;
  FIELDS[cur.name].forEach(([k,t])=>{ const v=$('f_'+k).value; o[k]= t==='number'? (Number(String(v).replace(/\D/g,''))||0) : v; });
  if(cur.name==='Transaksi' && !o.Pemilik) o.Pemilik=tab;
  if(cur.name==='Transaksi' && !o.Pemilik) return;
  if(cur.name==='Transaksi') o.Pemilik = o.Pemilik || tab;
  if(cur.name==='Tabungan'){
    const a=Math.abs(o.Jumlah||0);
    if(o.Jenis==='Tarik'){
      const have=sum(D.Tabungan.filter(t=>t.ID!==o.ID&&t.Pemilik===o.Pemilik&&t.Tujuan===o.Tujuan));
      if(a>have) return alert('Tabungan "'+o.Tujuan+'" ('+o.Pemilik+') hanya '+rp(have)+', tidak cukup untuk ditarik.');
      o.Jumlah=-a;
    } else o.Jumlah=a;
    delete o.Jenis;
  }
  if(cur.name==='Anggaran'&&!o.ID){ const e=D.Anggaran.find(x=>x.Kategori===o.Kategori); if(e) o.ID=e.ID; }
  const req = {Transaksi:['Tanggal','Kategori','Jumlah'],Tabungan:['Tanggal','Tujuan','Jumlah'],Wishlist:['Nama','Harga'],Kategori:['Nama'],Target:['Nama','Target'],Anggaran:['Kategori','Batas']}[cur.name];
  if(req.some(k=>!o[k])) return alert('Lengkapi data: '+req.join(', '));
  $('msave').disabled=true;
  try{
    const r = await call('save', cur.name, o);
    const i = D[cur.name].findIndex(x=>x.ID===r.ID);
    i>=0 ? D[cur.name][i]=r : D[cur.name].push(r);
    modal.hide(); render(); toast('Tersimpan ✓');
  }catch(e){} finally{ $('msave').disabled=false; }
}
async function del(name,id){
  if(!confirm('Hapus data ini?')) return;
  const ok=await call('del',name,id);
  if(!ok){ alert('Data tidak ditemukan di spreadsheet. Data dimuat ulang.'); return load(); }
  D[name]=D[name].filter(x=>x.ID!==id); render(); toast('Dihapus');
}

/* ---------- Pulihkan sesi setelah refresh (maks. 10 menit tidak aktif) ---------- */
(function restore(){
  try{
    const t=sessionStorage.getItem('tk'), la=Number(sessionStorage.getItem('la')||0);
    if(!t||Date.now()-la>600000) return;
    TOKEN=t; document.body.classList.remove('auth'); $('login').classList.add('d-none'); $('app').classList.remove('d-none'); bump();
    rpc('api',[t,'all']).then(d=>{ D=d; render(); }).catch(()=>logout());
  }catch(e){}
})();
</script>
</body>
</html>
